<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СНАБ·МАСТЕР — кликабельный прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F2EF; --ink:#191B1D; --ink2:#2A2D30; --mut:#8C9298;
    --line:#E0E2DE; --line2:#D2D4CF;
    --acc:#FFC60A; --acc-ink:#191B1D;
    --ok:#1E9D55; --ok-soft:#E6F4EC; --ok-line:#BfE4CC;
    --card:#FFFFFF; --dark:#1C1F22; --field:#F6F7F4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Golos Text',sans-serif;background:#23262A;
    background-image:radial-gradient(120% 80% at 50% -10%, #2E3338 0%, #20232700 60%);
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--ink)}
  .stage{display:flex;flex-direction:column;align-items:center;gap:13px}
  .phone{width:399px;max-width:100%;height:812px;max-height:calc(100dvh - 52px);background:var(--paper);border-radius:42px;border:1px solid #34383D;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.6),0 0 0 11px #15171A,0 0 0 12px #34383D;overflow:hidden;position:relative;display:flex;flex-direction:column}
  @media (max-width:560px){body{padding:0;background:var(--paper)}.cap{display:none}
    .phone{width:100%;height:100dvh;max-height:none;border-radius:0;border:0;box-shadow:none}}
  .sbar{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:700;color:var(--ink2)}
  .sbar .dots{display:flex;gap:6px;align-items:center}
  .screen{flex:1;overflow-y:auto;padding:4px 17px 28px}
  .screen::-webkit-scrollbar{width:0}
  .enter{animation:fade .32s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* header */
  .hd{display:flex;align-items:center;gap:12px;padding:8px 2px 2px}
  .back{width:42px;height:42px;flex:none;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--line);cursor:pointer}
  .back:active{transform:translateY(2px);box-shadow:none}
  .hd .t{font-family:'Russo One';font-size:20px}
  .hd .sub{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:1px}
  .brand{font-family:'Russo One';font-size:22px;color:var(--ink);padding:9px 3px 0}
  .brand .y{color:#caa200}
  .h1{font-family:'Russo One';font-size:26px;margin:4px 3px 2px}

  .lab{font-size:11.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);margin:18px 4px 9px;display:flex;align-items:center;gap:9px}
  .lab .ln{flex:1;height:1px;background:var(--line2)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 0 var(--line)}
  .full{width:100%}
  .tac{text-align:center}

  /* live delivery */
  .live{margin-top:12px;background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .live .pulse{width:11px;height:11px;border-radius:50%;background:var(--ok);position:relative;flex:none}
  .live .pulse::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ok);opacity:.5;animation:pp 1.8s ease-out infinite}
  @keyframes pp{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.5);opacity:0}}
  .live .lt{flex:1;min-width:0}
  .live .lt .a{font-weight:700;font-size:14px;color:#0f5e33}
  .live .lt .a span{font-family:'JetBrains Mono';font-weight:700}
  .live .lt .b{font-size:12px;color:#2f7a52;margin-top:1px}

  /* eyebrow group */
  .ey{display:flex;align-items:center;gap:9px;margin:20px 4px 11px}
  .ey .t{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
  .ey .ln{flex:1;height:1px;background:var(--line2)}

  /* tiles */
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;gap:13px;align-items:flex-start;box-shadow:0 1px 0 var(--line);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;width:100%;text-align:left;border-width:1px}
  .tile:active{transform:translateY(2px);box-shadow:none}
  .ico{width:46px;height:46px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;background:#F4F5F2;border:1px solid var(--line)}
  .ico svg{width:24px;height:24px}
  .meat{flex:1;min-width:0;padding-top:1px}
  .ttl{font-weight:700;font-size:16px;color:var(--ink);line-height:1.15}
  .desc{font-size:12.6px;color:var(--mut);margin-top:4px;line-height:1.3}
  .go{align-self:center;color:var(--line2);flex:none}

  .hero{background:var(--dark);border-radius:20px;color:#fff;position:relative;overflow:hidden;padding:17px 16px;box-shadow:0 10px 24px -10px rgba(0,0,0,.45);margin-top:2px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .12s ease;width:100%;text-align:left}
  .hero:active{transform:translateY(2px)}
  .hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:9px;background:repeating-linear-gradient(45deg,var(--acc) 0 9px,#191b1d 9px 18px)}
  .hero .hico{width:50px;height:50px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--acc);margin-left:6px}
  .hero .hm{flex:1;min-width:0}
  .hero .step{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--acc)}
  .hero .ht{font-family:'Russo One';font-size:18.5px;margin-top:3px;line-height:1.05}
  .hero .hd2{font-size:12.4px;color:#aab0b5;margin-top:5px;line-height:1.3}
  .hero .harr{color:#5a6166;flex:none}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .row2 .tile{flex-direction:column;align-items:flex-start;gap:0;padding:14px}
  .row2 .ico{margin-bottom:11px}
  .row2 .ttl{font-size:14.5px}
  .row2 .go{display:none}
  .soon .tile{background:#EFF0ED;border:1.5px dashed var(--line2);box-shadow:none;opacity:.95}
  .soon .ico{background:#E7E8E4;border-color:transparent}
  .pill{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#9a7c00;background:#FBEFC2;border:1px solid #F2DE94;padding:2px 7px;border-radius:999px}

  /* flow eyebrow */
  .flow{display:flex;align-items:center;gap:7px;margin:13px 2px 4px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
  .flow .now{color:var(--acc-ink);background:var(--acc);padding:3px 9px;border-radius:999px}
  .flow .nx{color:var(--mut)}
  .flow svg{color:var(--line2)}

  /* field rows */
  .fieldrow{padding:13px 15px;display:flex;align-items:center;gap:12px}
  .fieldrow+.fieldrow{border-top:1px solid var(--line)}
  .fieldrow .ic{width:20px;color:var(--mut);flex:none;display:flex}
  .fieldrow .fl{flex:1;min-width:0}
  .fieldrow .k{font-size:11px;color:var(--mut);font-weight:700}
  .fieldrow .v{font-size:15px;font-weight:600;color:var(--ink);margin-top:1px}
  .fieldrow .v.ph{color:#b9bdc2;font-weight:500}
  .fieldrow .chev{color:var(--line2);flex:none}

  .area{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 1px 0 var(--line)}
  .area .top{display:flex;align-items:flex-end;justify-content:space-between}
  .area .k{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
  .area .big{font-family:'JetBrains Mono';font-size:38px;font-weight:700;color:var(--ink);line-height:.9}
  .area .u{font-size:15px;color:var(--mut);font-weight:600;margin-left:5px}
  .area .pm{display:flex;gap:8px}
  .area .pm button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:22px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;line-height:1;cursor:pointer}
  .area .pm button:active{transform:translateY(1px)}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:5px}
  .seg button{padding:11px;border:0;background:transparent;border-radius:10px;font-size:14.5px;font-weight:700;color:var(--mut);cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}
  .norm{text-align:center;font-size:12px;color:var(--mut);margin-top:8px}
  .norm b{color:var(--ink2);font-family:'JetBrains Mono';font-weight:600}

  .subl{font-weight:700;color:var(--ink2);font-size:14px;margin:18px 2px 10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:10px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:'JetBrains Mono'}
  .chip.txt{font-family:'Golos Text'}
  .chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
  .hint{font-size:12px;color:var(--mut);margin:9px 2px 0;display:flex;align-items:center;gap:6px}

  .sw{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;box-shadow:0 1px 0 var(--line);cursor:pointer}
  .sw+.sw{margin-top:9px}
  .sw .swl{font-size:14px;font-weight:600}
  .sw .swl span{display:block;font-size:11px;color:var(--mut);font-weight:500;margin-top:1px}
  .tog{width:46px;height:27px;border-radius:999px;position:relative;flex:none;background:#cfd2cd;transition:background .15s}
  .tog.on{background:var(--ok)}
  .tog::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
  .tog.on::after{left:22px}

  /* calc line */
  .line{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 14px;box-shadow:0 1px 0 var(--line);display:flex;align-items:center;gap:13px}
  .line+.line{margin-top:9px}
  .line .lic{width:40px;height:40px;border-radius:11px;flex:none;background:#F4F5F2;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .line .mid{flex:1;min-width:0}
  .line .nm{font-size:14.5px;font-weight:700;color:var(--ink)}
  .line .mta{font-size:11px;color:var(--mut);margin-top:1px}
  .line .mta b{font-family:'JetBrains Mono';color:var(--ink2);font-weight:600}
  .line .num{font-family:'JetBrains Mono';font-size:25px;font-weight:700;color:var(--ink);line-height:1}
  .line .num.z{color:#c2c6c1}
  .line .un{font-size:12px;color:var(--mut);font-weight:600;margin-left:3px}

  /* result dark */
  .res{position:relative;overflow:hidden;background:var(--dark);border-radius:18px;color:#fff;padding:16px 16px 16px 22px;margin-top:22px;box-shadow:0 12px 26px -12px rgba(0,0,0,.5)}
  .res::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(45deg,var(--acc) 0 8px,#191b1d 8px 16px)}
  .res .rk{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--acc)}
  .res .items{margin-top:11px;display:flex;flex-direction:column;gap:8px}
  .res .it{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .res .it .n{font-size:14px;font-weight:600}
  .res .it .n s{font-style:normal;color:#9aa0a5;font-weight:500;font-size:12px}
  .res .it .q{font-family:'JetBrains Mono';font-size:16px;font-weight:700}
  .res .sum{margin-top:12px;padding-top:12px;border-top:1px solid #34383b;display:flex;align-items:center;justify-content:space-between}
  .res .sum .sl{color:#9aa0a5;font-size:13px;font-weight:600}
  .res .sum .sv{font-family:'JetBrains Mono';font-size:20px;font-weight:700;color:var(--acc)}

  /* basket item with stepper */
  .ci{display:flex;align-items:center;gap:11px;padding:11px 13px}
  .ci+.ci{border-top:1px solid var(--line)}
  .ci .cm{flex:1;min-width:0}
  .ci .cn{font-size:14px;font-weight:600;color:var(--ink);line-height:1.2}
  .ci .cs{font-style:normal;color:var(--mut);font-weight:500;font-size:11.5px;display:block;margin-top:2px}
  .ci .cs.tap{color:#3a6ea5;font-weight:700}
  .stp{display:flex;align-items:center;gap:0;flex:none;background:var(--field);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .stp button{width:32px;height:34px;border:0;background:transparent;font-size:19px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .stp button:active{background:#e9eae6}
  .stp .qn{min-width:34px;text-align:center;font-family:'JetBrains Mono';font-size:15px;font-weight:700;color:var(--ink)}
  .addrow{display:flex;align-items:center;gap:8px;padding:12px 14px;color:#3a6ea5;font-weight:700;font-size:13px;border-top:1px dashed var(--line2);cursor:pointer}

  .geo{margin-top:20px;background:var(--dark);border-radius:18px;color:#fff;padding:16px;display:flex;gap:13px;align-items:flex-start;box-shadow:0 12px 26px -12px rgba(0,0,0,.5);position:relative;overflow:hidden}
  .geo .gpin{width:44px;height:44px;border-radius:13px;flex:none;background:var(--acc);display:flex;align-items:center;justify-content:center}
  .geo .gm{flex:1}
  .geo .gt{font-weight:800;font-size:15px}
  .geo .gt b{font-family:'JetBrains Mono';color:var(--acc)}
  .geo .gd{font-size:12.4px;color:#aab0b5;margin-top:4px;line-height:1.35}
  .geo .ring{position:absolute;right:-12px;bottom:-12px;width:92px;height:92px;border-radius:50%;border:1.5px dashed #3a3f43}
  .geo .ring::after{content:'';position:absolute;inset:16px;border-radius:50%;border:1.5px dashed #2f3438}

  /* CTA */
  .cta{width:100%;border:0;border-radius:15px;padding:16px;font-size:16px;font-weight:800;font-family:'Golos Text';margin-top:13px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer}
  .cta.p{background:var(--acc);color:var(--acc-ink);box-shadow:0 4px 0 #d9a800}
  .cta.p:active{transform:translateY(3px);box-shadow:none}
  .cta.s{background:var(--card);color:var(--ink);border:1.5px solid var(--line2);box-shadow:0 2px 0 var(--line2)}
  .cta.s:active{transform:translateY(2px);box-shadow:none}
  .note{font-size:11.5px;color:var(--mut);text-align:center;margin-top:9px;line-height:1.4}
  .note b{color:var(--ink2);font-weight:700}

  /* pending offers */
  .pend{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 18px;text-align:center;box-shadow:0 1px 0 var(--line);margin-top:6px}
  .ldots{display:inline-flex;gap:6px;margin:14px 0 6px}
  .ldots i{width:9px;height:9px;border-radius:50%;background:var(--acc);animation:ld 1s infinite}
  .ldots i:nth-child(2){animation-delay:.15s}.ldots i:nth-child(3){animation-delay:.3s}
  @keyframes ld{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  .cnt{font-family:'JetBrains Mono';font-weight:700}

  /* offer card */
  .off{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 0 var(--line);margin-top:11px;animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
  .off .oh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .off .onm{font-weight:700;font-size:15.5px;color:var(--ink)}
  .off .ostars{font-size:12px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:5px}
  .off .ostars b{color:#caa200}
  .badge{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:999px;flex:none}
  .b-best{color:#0f5e33;background:#dff1e6;border:1px solid #bfe4cc}
  .b-fast{color:#9a7c00;background:#FBEFC2;border:1px solid #F2DE94}
  .off .oprice{font-family:'JetBrains Mono';font-size:27px;font-weight:700;color:var(--ink);margin-top:11px;line-height:1}
  .off .operbag{font-size:12px;color:var(--mut);font-weight:600;margin-top:3px}
  .off .orow{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;color:var(--ink2);font-weight:600}
  .off .orow svg{color:var(--mut);flex:none}
  .off .obtn{width:100%;margin-top:13px;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;font-family:'Golos Text';cursor:pointer}
  .off .obtn.p{background:var(--acc);color:var(--acc-ink);box-shadow:0 3px 0 #d9a800}
  .off .obtn.p:active{transform:translateY(2px);box-shadow:none}
  .off .obtn.s{background:#fff;color:var(--ink);border:1.5px solid var(--line2)}

  /* timeline */
  .ts{display:flex;gap:13px;padding:4px 0}
  .ts .dotc{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-weight:700;font-size:13px;position:relative;z-index:2}
  .ts:not(:last-child) .dotc::after{content:'';position:absolute;top:30px;left:50%;transform:translateX(-50%);width:2px;height:34px;background:var(--line2)}
  .ts.done .dotc{background:var(--ok);color:#fff}
  .ts.done:not(:last-child) .dotc::after{background:var(--ok)}
  .ts.cur .dotc{background:var(--acc);color:var(--acc-ink);box-shadow:0 0 0 5px rgba(255,198,10,.25)}
  .ts.wait .dotc{background:#E7E8E4;color:var(--mut)}
  .ts .tt{font-weight:700;font-size:14.5px;color:var(--ink)}
  .ts.wait .tt{color:var(--mut)}
  .ts .td{font-size:11.5px;color:var(--mut);margin-top:2px}
  .ts .tm{font-family:'JetBrains Mono';font-size:12px;color:var(--mut);font-weight:600}
  .tsrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

  .plate{display:inline-flex;align-items:stretch;border:1.5px solid #2a2d30;border-radius:6px;overflow:hidden;font-family:'JetBrains Mono';font-weight:700;background:#fff}
  .plate .pn{padding:5px 9px;font-size:16px;letter-spacing:1px;color:#191b1d}
  .plate .prg{border-left:1.5px solid #2a2d30;padding:5px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .plate .prg b{font-size:12px}.plate .prg s{font-size:7px;font-style:normal;letter-spacing:.5px}

  .bdg{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px}
  .bdg.ok{color:#0f5e33;background:var(--ok-soft);border:1px solid var(--ok-line)}
  .bdg.ac{color:#8a6a00;background:#FBEFC2;border:1px solid #F2DE94}

  .stars{display:flex;gap:7px;justify-content:center;margin-top:6px}
  .stars button{font-size:30px;color:#d8b43a;background:none;border:0;cursor:pointer;line-height:1}

  /* sheet */
  .ov{position:absolute;inset:0;background:rgba(15,17,19,.55);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
  .ov.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 17px 22px;box-shadow:0 -16px 40px -10px rgba(0,0,0,.4);max-height:82%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);z-index:50}
  .ov.on .sheet{transform:none}
  .grab{width:42px;height:5px;border-radius:3px;background:#d3d5d0;margin:4px auto 12px}
  .sh-t{font-family:'Russo One';font-size:18px;padding:0 2px}
  .sh-s{font-size:12px;color:var(--mut);margin:5px 2px 0;line-height:1.35}
  .opts{margin-top:13px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;cursor:pointer}

/* ===== UTILS ===== */
const $=s=>document.querySelector(s);
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const up=n=>Math.ceil(n);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2300)}
function openSheet(h){$('#sheet').innerHTML=h;$('#ov').classList.add('on')}
function closeSheet(){$('#ov').classList.remove('on')}
function clearT(){state.T.forEach(clearTimeout);state.T=[]}

function opt(id){return OPTIONS[id][state.itemOpt[id]]}

/* ===== РАСЧЁТ материала из замера ===== */
function calcMat(){
  const z=state.zamer, t=z.thick, tc=Math.min(t,15);
  return {
    gips: up(z.gm*t*0.85*1.05/30),
    cps:  up(z.cm*tc*1.7*1.05/30),
    mayak:up(z.gm/2),               // ≈ прикидка по площади
    ugol: up(z.ot/2.8) + up(z.pg/2.8),
    prof: up(z.ot/2.4),
    grunt:up((z.gm+z.cm)*0.1/10),
  };
}
function basketTotal(){
  let s=state.items.reduce((a,it)=>a+it.qty*(PRICE[it.id]||0),0);
  s+=state.extra.reduce((a,e)=>a+e.qty*PRICE.rashod,0);
  return s;
}

/* ===== ОТКЛИКИ ===== */
function sendOrder(){
  const base=basketTotal();
  state.offers=SUP.map((s,i)=>({...s,total:Math.round(base*s.k/100)*100,shown:false,idx:i}));
  state.chosen=null;go('offers');
}
function vOffers(){
  const shown=state.offers.filter(o=>o.shown).sort((a,b)=>a.total-b.total);
  const all=state.offers.every(o=>o.shown);
  const best=shown.length?Math.min(...shown.map(o=>o.total)):0;
  const head=!all?`<div class="pend"><b style="font-size:16px">Поставщики считают цену</b>
      <div class="ldots"><i></i><i></i><i></i></div>
      <div class="note" style="margin-top:2px"><span class="cnt">${shown.length}</span> из 4 ответили · обычно 10–15 мин</div></div>`
    :`<div class="note" style="text-align:left;margin:6px 2px 0;font-size:13px"><b style="color:var(--ink)">${shown.length} предложения</b> · сначала дешевле · цена зафиксирована на 24 ч</div>`;
  const cards=shown.map(o=>{
    const isBest=o.total===best;
    return `<div class="off"><div class="oh"><div><div class="onm">${o.n}</div>
      <div class="ostars"><b>★ ${o.r}</b> · ${o.deals} сделок</div></div>
      ${isBest?'<span class="badge b-best">Лучшая цена</span>':(o.d===0?'<span class="badge b-fast">Сегодня</span>':'')}</div>

      <div class="operbag">весь список одной машиной</div>
      <div class="orow">${IC.truck} Доставка ${o.mark}</div>
      <button class="obtn ${isBest?'p':'s'}" onclick="choose(${o.idx})">Выбрать этого</button></div>`;
  }).join('');
  return `<div class="hd"><div class="back" onclick="go('order')">${IC.back}</div><div class="t">Предложения</div></div>
  <div class="note" style="text-align:left;margin:6px 2px 0">${opt('gips').n.split(' · ')[0]} · ${state.items[0].qty} меш. + ЦПС + расходка · Коммунарка</div>
  ${head}${cards}`;
}
function scheduleOffers(){state.offers.forEach((o,i)=>{if(o.shown)return;
  state.T.push(setTimeout(()=>{o.shown=true;if(state.screen==='offers')render()},850+i*1150));});}
function choose(idx){
  const o=state.offers.find(x=>x.idx===idx);
  state.order={id:2847,sup:o,total:o.total,step:0,times:[nowT(),'','',''],done:false,short:opt('gips').n.split(' · ')[0]+' · '+state.items[0].qty+' меш. + ЦПС'};
  // прицепляем заказ к объекту
  state.objects[0].orders.unshift({id:2847,sum:o.total,when:'только что',status:'active',short:state.order.short});
  go('success');
}

/* ===== УСПЕХ ===== */
function vSuccess(){const o=state.order;return `<div class="okwrap">
  <svg class="okmark" viewBox="0 0 110 110"><circle cx="55" cy="55" r="42"/><path d="M36 57 L49 70 L76 43"/></svg>
  <div class="h1" style="margin-top:8px">Заказ №${o.id}<br>оформлен</div>
  <div class="note" style="font-size:13px;margin-top:8px">${o.sup.n} уже собирает заказ.<br>Сохранён в объекте на Калужской.</div></div>`;}

/* ===== СТАТУС ===== */
let orderTimer=null;
function scheduleStatus(){if(!state.order||state.order.done||orderTimer)return;orderTimer=setInterval(advOrder,4200)}
function advOrder(){const o=state.order;if(!o||o.done){clearInterval(orderTimer);orderTimer=null;return}
  o.step++;o.times[o.step]=nowT();if(o.step>=3){o.done=true;o.arrived=nowT();
    const r=state.objects[0].orders.find(x=>x.id===o.id);if(r)r.status='done';
    clearInterval(orderTimer);orderTimer=null}
  if(['status','home','objectDetail'].includes(state.screen))render()}
function ffwd(){advOrder()}
function vStatus(){const o=state.order;if(!o)return vHome();
  const tl=STEPS.map((s,i)=>{const cls=i<o.step?'done':i===o.step?(o.done?'done':'cur'):'wait';
    return `<div class="ts ${cls}"><div class="dotc">${i<o.step||(o.done&&i===o.step)?IC.check:i+1}</div>
      <div style="flex:1"><div class="tsrow"><span class="tt">${s.t}</span><span class="tm">${o.times[i]||''}</span></div>
      <div class="td">${s.d}</div></div></div>`;}).join('');
  const truck=o.step>=2?`<div class="lab"><span>Машина</span><span class="ln"></span></div>
    <div class="card" style="padding:14px"><div class="tsrow" style="align-items:center">
      <div class="plate"><span class="pn">А 412 ВС</span><span class="prg"><b>750</b><s>RUS</s></span></div>
      <button class="cta s" style="margin:0;width:auto;padding:10px 14px;font-size:13.5px;display:inline-flex;gap:7px" onclick="toast('Звоним водителю…')">${IC.phone} Позвонить</button></div>
      <div style="height:1px;background:var(--line);margin:13px 0"></div>
      <div class="fieldrow" style="padding:0 0 9px"><div class="fl"><div class="k">Машина</div><div class="v">ГАЗель NEXT · борт 3 т</div></div></div>
      <div class="fieldrow" style="padding:0;border:0"><div class="fl"><div class="k">Водитель</div><div class="v">Сергей Ковалёв</div></div></div>
      <div class="chips" style="margin-top:12px"><span class="bdg ok">✓ Пропуск на объект оформлен</span>
        <span class="bdg ac">${o.done?'Доставлено в '+o.arrived:'Прибытие ~16:00'}</span></div></div>`:'';
  const done=o.done?`<div class="card" style="background:var(--ok-soft);border-color:var(--ok-line);padding:16px;margin-top:13px">
      <div class="tac"><b style="font-size:16px">Заказ доставлен 🎉</b>
      <div class="note" style="margin:4px 0 10px">Накладная подписана. Как вам поставщик?</div>
      <div class="stars">${[1,2,3,4,5].map(n=>`<button onclick="toast('Спасибо! ★'+${n})">★</button>`).join('')}</div></div></div>
    <button class="cta s" onclick="prepOrder(true)">Повторить заказ</button>`
    :`<button class="cta s" onclick="ffwd()">⏩ Промотать доставку (демо)</button>`;
  return `<div class="hd"><div class="back" onclick="go('home')">${IC.back}</div><div class="t">Заказ №${o.id}</div></div>
  <div class="card" style="padding:14px;margin-top:6px"><div class="tsrow"><b style="font-size:15.5px">${o.sup.n}</b>
    <span style="font-family:'JetBrains Mono';font-weight:700;font-size:18px">${rub(o.total)}</span></div>
    <div class="note" style="text-align:left;margin-top:4px">${o.short} · Коммунарка</div></div>
  <div class="lab"><span>Доставка</span><span class="ln"></span></div>
  <div class="card" style="padding:14px 15px">${tl}</div>${truck}${done}`;
}

/* ===== ОБЪЕКТЫ ===== */
function vObjects(){
  const cards=state.objects.map((ob,i)=>{
    const act=ob.orders.filter(o=>o.status==='active').length;
    return `<button class="tile" style="margin-top:11px" onclick="openObj(${i})">
      <div class="ico">${IC.pin}</div>
      <div class="meat"><div class="ttl">${ob.addr.split(' — ')[0]}</div>
        <div class="desc">${ob.city} · заказов: ${ob.orders.length}${act?` · <b style="color:var(--ok)">${act} в пути</b>`:''}</div></div>
      <span class="go">${IC.chev}</span></button>`;
  }).join('');
  return `<div class="hd"><div class="back" onclick="go('home')">${IC.back}</div><div class="t">Объекты</div></div>
  <div class="note" style="text-align:left;margin:8px 2px 0">Как «проекты» у Петровича: заказы, расход и доставки — внутри каждого объекта.</div>
  ${cards}
  <button class="tile" style="margin-top:11px;border-style:dashed;justify-content:center;color:#3a6ea5" onclick="go('zamer')">
    <span style="font-weight:700">${IC.plus} Новый объект — замер</span></button>`;
}
let curObj=0;
function openObj(i){curObj=i;go('objectDetail')}
function vObjectDetail(){
  const ob=state.objects[curObj];
  const orders=ob.orders.length?ob.orders.map(o=>`
    <div class="card" style="margin-top:10px;padding:13px 14px;cursor:pointer" onclick="${o.status==='active'?"go('status')":"toast('Архив заказа — в полной версии')"}">
      <div class="tsrow"><b style="font-size:14.5px">Заказ №${o.id}</b>
        <span style="font-family:'JetBrains Mono';font-weight:700">${rub(o.sum)}</span></div>
      <div class="note" style="text-align:left;margin:3px 0 9px">${o.short}</div>
      <div class="tsrow" style="align-items:center">
        <span class="bdg ${o.status==='active'?'ac':'ok'}">${o.status==='active'?'🚚 В пути':'✓ Доставлен'} · ${o.when}</span>
        <span style="color:#3a6ea5;font-weight:700;font-size:13px">Повторить →</span></div>
    </div>`).join(''):`<div class="note" style="margin-top:14px">Заказов по объекту пока нет.</div>`;
  return `<div class="hd"><div class="back" onclick="go('objects')">${IC.back}</div><div class="t">Объект</div></div>
  <div class="card" style="padding:14px;margin-top:6px">
    <div class="fieldrow" style="padding:0 0 10px"><span class="ic">${IC.pin}</span><div class="fl"><div class="k">Адрес</div><div class="v">${ob.addr}</div></div></div>
    <div style="height:1px;background:var(--line);margin:0 0 11px"></div>
    <div class="tsrow"><span class="note" style="margin:0">Всего заказов: ${ob.orders.length}</span>
      <span class="note" style="margin:0">Расход: <b>${rub(ob.orders.reduce((a,o)=>a+o.sum,0))}</b></span></div>
  </div>
  <div class="lab"><span>Заказы объекта</span><span class="ln"></span></div>
  ${orders}
  <button class="cta s" onclick="prepOrder(true)" style="margin-top:13px">Новый заказ на объект ${IC.truck}</button>`;
}

/* ===== ROUTER ===== */
function render(){
  const sc=$('#screen');let h='';
  switch(state.screen){
    case 'home':h=vHome();break; case 'zamer':h=vZamer();break;
    case 'order':h=vOrder();break; case 'offers':h=vOffers();break;
    case 'success':h=vSuccess();break; case 'status':h=vStatus();break;
    case 'objects':h=vObjects();break; case 'objectDetail':h=vObjectDetail();break;
    default:h=vHome();
  }
  sc.innerHTML=h;
  if(state.screen==='offers')scheduleOffers();
  if(['status','home','objectDetail'].includes(state.screen))scheduleStatus();
  if(state.screen==='success')state.T.push(setTimeout(()=>go('status'),1900));
}
function go(s){clearT();closeSheet();state.screen=s;render();
  const sc=$('#screen');sc.scrollTop=0;sc.classList.remove('enter');void sc.offsetWidth;sc.classList.add('enter');}
window.addEventListener('load',()=>{
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
  go('home');
});


/* ===== СТОРОНА ДИЛЕРА (функции) ===== */
const REQS=[
  {id:2847, what:'КНАУФ МП 75 белый · 116 меш. + ЦПС 27 + расходка', city:'Коммунарка', dist:'8 км', when:'завтра к утру', ago:'2 мин назад', urgent:false,
   mast:{n:'Артём М.', r:4.8, deals:40}, floor:'5 этаж · ~40 м · без лифта',
   pos:[{n:'КНАУФ МП 75 · белый',q:'116 меш.',base:520},{n:'ЦПС · KREISEL 521',q:'27 меш.',base:430},
        {n:'Маяки оцинк. 6 мм',q:'52 шт',base:60},{n:'Уголок оцинк. 20×20',q:'10 шт',base:88},
        {n:'Профиль примыкания',q:'8 шт',base:135},{n:'Грунт Бетоконтакт',q:'2 шт',base:760}]},
  {id:2848, what:'Волма Гипс Актив серый · 80 меш.', city:'Мытищи', dist:'3 км', when:'сегодня к 18:00', ago:'11 мин назад', urgent:true,
   mast:{n:'Руслан К.', r:4.9, deals:73}, floor:'2 этаж · ~15 м · лифт', pos:[]},
  {id:2849, what:'ЦПС Русеан · 45 меш. + сетка', city:'Подольск', dist:'12 км', when:'послезавтра', ago:'24 мин назад', urgent:false,
   mast:{n:'Дмитрий В.', r:4.6, deals:18}, floor:'1 этаж · подвоз к двери', pos:[]},
];
/* dealer state merged into unified state */

function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2)}

/* ===== ЛЕНТА ЗАЯВОК ===== */
function vFeed(){
  const cards=REQS.map(r=>`
    <div class="req ${r.urgent?'urgent':''}" onclick="openReq(${r.id})">
      <div class="rtop"><div class="what">${r.what}</div><div class="ago">${r.ago}</div></div>
      <div class="meta">
        <span class="tagi">${IC.pin} ${r.city} · ${r.dist}</span>
        <span class="tagi ${r.urgent?'warm':''}">${IC.clock} ${r.when}</span>
      </div>
      <div class="mast">
        <div class="mav">${initials(r.mast.n)}</div>
        <div class="mn">${r.mast.n} <s>· ★ ${r.mast.r} · ${r.mast.deals} заказов</s></div>
        <div class="resp">Ответить ${IC.arr}</div>
      </div>
    </div>`).join('');
  return `
  <div class="dhead">
    <div class="dbrand">СНАБ·МАСТЕР<span class="tag">Поставщик</span></div>
    <div class="me"><div class="av">С</div><div class="mr">СтройБаза<br><b>★ 4.8</b> · 212 сделок</div></div>
  </div>
  <button class="roleswap" style="margin:8px 2px 2px" onclick="setSide(null)">↔ сменить роль</button><div class="lab"><span>Заявки рядом</span><span class="ln"></span><span class="cnt">${REQS.length} новых</span></div>
  <div class="note" style="text-align:left;margin:0 2px 12px">Мастера в радиусе 15 км ищут материал. Ответь ценой — заявка твоя. Кто быстрее и выгоднее, того и выберут.</div>
  ${cards}
  <div class="note" style="margin-top:14px">Заявки приходят от мастеров поблизости. Откликнулся — мастер видит твою цену в сравнении с другими.</div>`;
}

/* ===== ОТВЕТ НА ЗАЯВКУ ===== */
function openReq(id){state.req=REQS.find(r=>r.id===id);state.prices={};state.deliv='';state.unload='';
  // префилл базовыми ценами для демо (будущая «память прайса»)
  state.req.pos.forEach((p,i)=>state.prices[i]=p.base);
  state.deliv=3500;state.unload=2800;
  go('respond');}

function lineSum(i){const p=state.req.pos[i];const price=state.prices[i]||0;const q=parseInt(p.q);return price*q}
function grand(){let s=state.req.pos.reduce((a,p,i)=>a+lineSum(i),0);s+=(+state.deliv||0)+(+state.unload||0);return s}

function vRespond(){
  const r=state.req;
  const rows=r.pos.map((p,i)=>`
    <div class="prow">
      <div class="pm"><div class="pn">${p.n}</div><div class="pq">${p.q}</div></div>
      <div class="pin ${state.prices[i]?'filled':''}"><input type="number" inputmode="numeric" value="${state.prices[i]||''}" placeholder="0" oninput="setPrice(${i},this.value)"><span class="cur">₽/шт</span></div>
      <div class="lsum">${state.prices[i]?rub(lineSum(i)):'—'}</div>
    </div>`).join('');
  return `
  <div class="hd"><div class="back" onclick="go('feed')">${IC.back}</div><div class="t">Ответ на заявку</div></div>

  <div class="sum-strip">
    <div class="mav">${initials(r.mast.n)}</div>
    <div class="si"><div class="a">${r.mast.n} · ${r.city}</div><div class="b">${r.when} · ${r.dist} от тебя</div></div>
    <div class="rt">★ ${r.mast.r}<br><b>${r.mast.deals} заказов</b></div>
  </div>

  <div class="lab"><span>Цена по позициям</span><span class="ln"></span></div>
  ${rows}

  <div class="lab"><span>Доставка и разгрузка</span><span class="ln"></span></div>
  <div class="xrow">
    <div class="xi">${IC.truck}</div>
    <div class="xm"><div class="xn">Доставка</div><div class="xs">${r.city} · ${r.dist}</div></div>
    <div class="pin ${state.deliv?'filled':''}"><input type="number" inputmode="numeric" value="${state.deliv||''}" placeholder="0" oninput="setDeliv(this.value)"><span class="cur">₽</span></div>
  </div>
  <div class="xrow">
    <div class="xi">${IC.up}</div>
    <div class="xm"><div class="xn">Разгрузка и подъём</div><div class="xs">${r.floor}</div></div>
    <div class="pin ${state.unload?'filled':''}"><input type="number" inputmode="numeric" value="${state.unload||''}" placeholder="0" oninput="setUnload(this.value)"><span class="cur">₽</span></div>
  </div>
  <div class="note" style="text-align:left;margin-top:8px">Этаж и метраж пришли из заявки мастера — посчитай подъём заранее, чтобы не доплачивал на месте.</div>

  <div class="total">
    <div class="tcard">
      <div class="trow"><span>Материал (${r.pos.length} позиций)</span><span>${rub(r.pos.reduce((a,p,i)=>a+lineSum(i),0))}</span></div>
      <div class="trow"><span>Доставка</span><span>${rub(+state.deliv||0)}</span></div>
      <div class="trow"><span>Разгрузка и подъём</span><span>${rub(+state.unload||0)}</span></div>
      <div class="grand"><span class="gl">Итого мастеру</span><span class="gv">${rub(grand())}</span></div>
    </div>
    <button class="btn" onclick="toast('Отклик отправлен мастеру!')">Откликнуться ${IC.send}</button>
    <div class="future">⚡ <div>Когда «прикормишься» — твои цены сохранятся. Дальше: прилетела заявка → правишь дельту → откликаешься в два тапа. Потом — привязка к твоей CRM, отклик мгновенный.</div></div>
  </div>`;
}
function setPrice(i,v){state.prices[i]=+v||0;render()}
function setDeliv(v){state.deliv=+v||0;render()}
function setUnload(v){state.unload=+v||0;render()}



/* ============================================================
   РАСШИРЕНИЯ ДЛЯ ЕДИНОГО ПРИЛОЖЕНИЯ (мастер + дилер + лендинг)
   ============================================================ */
Object.assign(IC,{
  box:'<svg width="14" viewBox="0 0 24 24" fill="none"><path d="M12 3l8 4-8 4-8-4 8-4zM4 7v10l8 4 8-4V7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  up:'<svg width="20" viewBox="0 0 24 24" fill="none"><path d="M12 20V8M7 12l5-5 5 5" stroke="#191b1d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 4h12" stroke="#191b1d" stroke-width="1.7" stroke-linecap="round"/></svg>',
  arr:'<svg width="13" height="11" viewBox="0 0 13 11" fill="none"><path d="M1 5.5h10M8 2 11 5.5 8 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  send:'<svg width="16" viewBox="0 0 24 24" fill="none"><path d="M21 3 11 13M21 3l-6.5 18-3.5-8-8-3.5L21 3z" stroke="#191b1d" stroke-width="1.8" stroke-linejoin="round"/></svg>'
});
Object.assign(state,{side:null, req:null, prices:{}, deliv:'', unload:''});

/* ручной ввод в замере */
function zset(k,v){ state.zamer[k]=Math.max(0, parseInt(v)||0); render(); }

/* ===== ЛЕНДИНГ — выбор роли ===== */
function vLanding(){
  return `<div class="land">
    <div class="lhero">
      <div class="lbrand">СНАБ·<span class="y">МАСТЕР</span></div>
      <span class="ltag">Тендер на материал · цена до −40%</span>
      <div class="lsub">Площадка сводит мастера-штукатура с поставщиками материала напрямую. Замерил — заявка ушла локальным дилерам — выбрал по цене.</div>
    </div>
    <div class="pick">Войти как</div>
    <div class="rolewrap">
      <button class="rolebtn master" onclick="setSide('master')">
        <div class="ric">${IC.ruler}</div>
        <div class="rm"><div class="rt">Мастер</div><div class="rd">Замер, смета, заказ материала, объекты, доставка</div></div>
        <span class="rgo">${IC.chev}</span>
      </button>
      <button class="rolebtn dealer" onclick="setSide('dealer')">
        <div class="ric">${IC.truck}</div>
        <div class="rm"><div class="rt">Дилер · поставщик</div><div class="rd">Заявки рядом, ответ ценой, доставка и разгрузка</div></div>
        <span class="rgo">${IC.chev}</span>
      </button>
    </div>
    <div class="lnote">Прототип на моках для проверки в поле — данные ненастоящие. В Telegram открывается как мини-приложение во весь экран. Роль можно сменить в любой момент.</div>
  </div>`;
}
function setSide(s){
  clearT(); closeSheet();
  state.side=s;
  state.screen = s==='dealer' ? 'feed' : (s==='master' ? 'home' : null);
  render();
  const sc=$('#screen'); sc.scrollTop=0; sc.classList.remove('enter'); void sc.offsetWidth; sc.classList.add('enter');
}

/* ===== ЕДИНЫЙ РОУТЕР (перекрывает мастерский) ===== */
function render(){
  const sc=$('#screen');
  const act=document.activeElement, wasInput=act&&act.tagName==='INPUT';
  const sel=wasInput?[...sc.querySelectorAll('input')].indexOf(act):-1;
  const pos=wasInput?(act.selectionStart||0):0;
  let h='';
  if(state.side===null){ h=vLanding(); }
  else if(state.side==='dealer'){ h = state.screen==='respond' ? vRespond() : vFeed(); }
  else {
    switch(state.screen){
      case 'home':h=vHome();break; case 'zamer':h=vZamer();break;
      case 'order':h=vOrder();break; case 'offers':h=vOffers();break;
      case 'success':h=vSuccess();break; case 'status':h=vStatus();break;
      case 'objects':h=vObjects();break; case 'objectDetail':h=vObjectDetail();break;
      default:h=vHome();
    }
  }
  sc.innerHTML=h;
  if(sel>=0){const ins=sc.querySelectorAll('input'); if(ins[sel]){ins[sel].focus(); try{ins[sel].setSelectionRange(pos,pos)}catch(e){}}}
  if(state.side==='master'){
    if(state.screen==='offers')scheduleOffers();
    if(['status','home','objectDetail'].includes(state.screen))scheduleStatus();
    if(state.screen==='success')state.T.push(setTimeout(()=>go('status'),1900));
  }
}

/* старт — на лендинге */
window.addEventListener('load',()=>{
  const ov=$('#ov'); if(ov) ov.addEventListener('click',e=>{ if(e.target.id==='ov') closeSheet(); });
  state.side=null; state.screen=null; render();
});

</script>
</body>
</html>
